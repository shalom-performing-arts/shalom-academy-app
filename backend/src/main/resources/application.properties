spring.application.name=receipts-api
# Cloud Run says which port to use in PORT; on the office computer it is 8080.
server.port=${PORT:8080}
# Behind Cloud Run (or any https proxy) the request arrives as plain http; trust the proxy's
# X-Forwarded-Proto/Host so the app knows its own https address. Without this the browser's own
# requests look as if they came from another site and are refused (403).
server.forward-headers-strategy=native

# Where the data is kept: "postgres" (the database, below) or "json" (the files in app.data-dir,
# as before the database). Run with the "json" profile for the files: --spring.profiles.active=json
app.storage=${APP_STORAGE:postgres}

# The PostgreSQL database. The tables are made by the scripts in src/main/resources/db/migration
# (Flyway) the first time the app starts; on that first start, the JSON files in app.data-dir are
# copied in. Set DB_PASSWORD (and DB_URL / DB_USER if they differ) before starting.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shalom}
spring.datasource.username=${DB_USER:shalom}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
# Let a sleeping database sleep: idle connections close after a minute and none are kept open,
# so Neon (free plan, billed by the hour it is awake) can suspend as soon as the app goes quiet.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=0
spring.flyway.locations=classpath:db/migration
# the database password lives in data/database.properties (not in git), when that file is there
spring.config.import=optional:file:${app.data-dir:data}/database.properties

# Folder holding the JSON files (students.json, receipts.json …): read once to fill the database,
# and the data itself when app.storage=json. Relative paths resolve against backend/.
app.data-dir=${DATA_DIR:data}

# The one shared password. When APP_PASSWORD is not set, the password is read from
# data/password.txt, which is created with a random password on first start.
app.password=${APP_PASSWORD:}

# Origins allowed to call the API directly (comma-separated). Not needed when the
# Angular dev server proxies /api, which is how `npm start` runs it.
app.cors-origins=${CORS_ORIGINS:http://localhost:4200}
